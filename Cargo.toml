[workspace]
members = [
    "crates/opticcode-cli",
    "crates/opticcode-core",
    "crates/opticcode-llm",
    "crates/opticcode-tools",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/local/opticcode"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
walkdir = "2.5"

opticcode-core = { path = "crates/opticcode-core" }
opticcode-llm = { path = "crates/opticcode-llm" }
opticcode-tools = { path = "crates/opticcode-tools" }
