[workspace]
members = [
    "crates/opticcode-cli",
    "crates/opticcode-core",
    "crates/opticcode-llm",
    "crates/opticcode-policy",
    "crates/opticcode-tools",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/local/opticcode"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
blake3 = "1.8.5"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
regex = "1.12"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tree-sitter = "0.26.11"
tree-sitter-java = "0.23.5"
walkdir = "2.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

opticcode-core = { path = "crates/opticcode-core" }
opticcode-llm = { path = "crates/opticcode-llm" }
opticcode-policy = { path = "crates/opticcode-policy" }
opticcode-tools = { path = "crates/opticcode-tools" }
